<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — BrightPath × S360</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: #f6f7f9;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .login-card {
      background: #ffffff;
      border: 1px solid #e5e7ec;
      border-radius: 20px;
      padding: 48px 44px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
    }

    /* Brand */
    .login-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .login-brand-mark {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.08em;
      background: #0f172a;
      color: #fff;
      padding: 5px 8px;
      border-radius: 5px;
    }
    .login-brand-x { color: #94a3b8; font-size: 16px; }
    .login-brand-client { font-weight: 700; font-size: 17px; color: #0f172a; }

    /* Headline */
    .login-eyebrow {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      font-weight: 500;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .login-title {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }
    .login-sub {
      font-size: 14px;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 36px;
    }

    /* Google button container */
    .login-google-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    /* Error */
    .login-error {
      display: none;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 13.5px;
      color: #dc2626;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .login-error.visible { display: block; }

    /* Footer */
    .login-footer {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.6;
      margin-top: 8px;
    }
    .login-footer strong { color: #64748b; font-weight: 500; }

    /* Divider */
    .login-divider {
      height: 1px;
      background: #f1f5f9;
      margin: 28px 0;
    }

    /* Loading state */
    .login-loading {
      display: none;
      font-size: 13.5px;
      color: #64748b;
      padding: 12px;
    }
    .login-loading.visible { display: block; }
  </style>
</head>
<body>

  <div class="login-card">

    <div class="login-brand">
      <span class="login-brand-mark">S360</span>
      <span class="login-brand-x">×</span>
      <span class="login-brand-client">BrightPath</span>
    </div>

    <div class="login-eyebrow">Engagement Tracker</div>
    <h1 class="login-title">Sign in to continue</h1>
    <p class="login-sub">Use your BrightPath or Summit 360 Google account to access the engagement dashboard.</p>

    <div id="login-error" class="login-error"></div>
    <div id="login-loading" class="login-loading">Signing you in…</div>

    <div class="login-google-wrap">
      <div id="g_id_onload"
           data-client_id=""
           data-callback="onGoogleSignIn"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin"
           data-type="standard"
           data-size="large"
           data-theme="outline"
           data-text="signin_with"
           data-shape="rectangular"
           data-logo_alignment="left"
           data-width="320">
      </div>
    </div>

    <div class="login-divider"></div>

    <p class="login-footer">
      Access is limited to <strong>@brightpath-mn.com</strong> and <strong>@s360team.com</strong> accounts.<br>
      Need access? Contact your Summit 360 success manager.
    </p>

  </div>

  <!-- Load auth-config first, then auth.js, then Google GIS -->
  <script src="auth-config.js"></script>
  <script src="auth.js"></script>
  <script>
    // Inject the client ID from auth-config into the GIS element
    document.addEventListener('DOMContentLoaded', function () {
      const cfg = window.AUTH_CONFIG;
      if (cfg && cfg.clientId) {
        document.getElementById('g_id_onload').setAttribute('data-client_id', cfg.clientId);
      }

      // If there's already a valid session, skip the login page
      const session = window.BPAuth.loadSession();
      if (window.BPAuth.isSessionValid(session)) {
        const params = new URLSearchParams(window.location.search);
        const next = params.get('next') || '/';
        window.location.replace(next);
      }
    });

    function onGoogleSignIn(response) {
      const result = window.BPAuth.handleCredential(response);

      if (result.ok) {
        document.getElementById('login-loading').classList.add('visible');
        document.getElementById('login-error').classList.remove('visible');

        // Redirect to original destination or dashboard
        const params = new URLSearchParams(window.location.search);
        const next = params.get('next') || '/';
        window.location.replace(next);
      } else {
        const errEl = document.getElementById('login-error');
        if (result.reason === 'not_allowed') {
          errEl.textContent = `Access denied for ${result.email}. This dashboard is restricted to BrightPath team members and approved S360 collaborators. Contact your success manager to request access.`;
        } else {
          errEl.textContent = 'Sign-in failed. Please try again.';
        }
        errEl.classList.add('visible');
      }
    }
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

</body>
</html>
